# Runs the booking engine's tests on every push to main and every pull request.
# No credentials needed: the functions tests use an in-memory Firestore
# stand-in, and the rules tests use the local Firestore emulator with a
# demo project id.
#
# Also runs the Python platform checks (tests, formatting, types) on every
# supported Python version, and the lint tooling for new platform surfaces.
# Neither needs a database or any credential.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Functions (booking logic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schedule-booking/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: schedule-booking/functions/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  admin:
    name: Admin panel (pure logic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schedule-booking/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/lib.test.js

  rules:
    name: Firestore security rules (emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schedule-booking/rules-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: schedule-booking/rules-test/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm test

  python:
    name: Python platform (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m black --check main.py postgres.py api payments tests
      - run: python -m isort --check-only main.py postgres.py api payments tests
      - run: python -m mypy
      - run: python -m pytest -q

  lint:
    name: Lint (ESLint, Prettier, Markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

version: 2.1

orbs:
  node: circleci/node@5.2.0

commands:
  https_checkout:
    steps:
      - run:
          name: Checkout code via HTTPS
          command: |
            git clone --filter=blob:none \
              "https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git" .
            git checkout "$CIRCLE_SHA1"

# The current frontend is static: there is no build or lint command, and
# this repository has no Python package. Run the existing test suites.
jobs:
  functions:
    docker:
      - image: cimg/node:22.22.0
    steps:
      - https_checkout
      - run:
          name: Install functions dependencies
          working_directory: schedule-booking/functions
          command: npm ci --no-audit --no-fund
      - run:
          name: Test booking logic
          working_directory: schedule-booking/functions
          command: npm test

  admin:
    docker:
      - image: cimg/node:22.22.0
    steps:
      - https_checkout
      - run:
          name: Test admin panel logic
          working_directory: schedule-booking/admin
          command: npm test

  rules:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - https_checkout
      - node/install:
          node-version: '22.22.0'
      - run:
          name: Install security rules test dependencies
          working_directory: schedule-booking/rules-test
          command: npm ci --no-audit --no-fund
      - run:
          name: Test Firestore security rules
          working_directory: schedule-booking/rules-test
          command: npm test

workflows:
  tests:
    jobs:
      - functions
      - admin
      - rules

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Booking Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <img class="brand-logo" src="assets/logo.svg" alt="Booking admin">
            <span class="topbar-title">Booking admin</span>
            <div class="topbar-user" id="topbar-user" hidden>
                <span class="topbar-email" id="user-email"></span>
                <button type="button" class="btn btn-ghost" id="sign-out-btn">Sign out</button>
            </div>
        </div>
    </header>

    <main id="app" class="container">
        <p class="muted">Loading&hellip;</p>
    </main>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <noscript><p class="container">This admin panel needs JavaScript.</p></noscript>
    <script type="module" src="js/app.js"></script>
</body>
</html>
